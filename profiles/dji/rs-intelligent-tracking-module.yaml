schema_version: 1
id: dji-rs-intelligent-tracking-module
profile_version: 1
origin: official
status: verified
updated: '2026-09-12'
device:
  vendor: DJI
  model: RS Intelligent Tracking Module
  aliases:
  - DJI RS Intelligent Tracking Module
  category: Gimbal
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/global/downloads/products/rs-4-mini
  discovery:
    document_type: pdf
    item_selector: div[class^="style__document-item___"], li.groups-download-item
    title_contains:
    - DJI RS 4 Mini  - DJI RS Intelligent Tracking Module Firmware v1.0 Release Notes
    url_contains:
    - DJI_RS_Intelligent_Tracking_module
    - Release_Notes
    url_excludes: []
    url_pattern: (?:_|-)en(?:[_.0-9-]|\.pdf)
  extraction:
    version:
      labels:
      - 'Firmware:'
      pattern: (?:[Vv]\s*)?([0-9]+(?:\.[0-9]+){2,3})
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
    whats_new:
      start_labels:
      - What's New?
      end_labels:
      - http://www.dji.com/rs-4-mini
      max_items: 10
    scope: first_release_first_page
    pdf_text:
      x_tolerance: 1
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
    document_titles:
    - DJI RS Intelligent Tracking Module Release Notes
