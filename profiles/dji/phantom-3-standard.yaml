schema_version: 1
id: dji-phantom-3-standard
profile_version: 1
origin: official
status: verified
updated: '2026-09-12'
device:
  vendor: DJI
  model: Phantom 3 Standard
  aliases:
  - DJI Phantom 3 Standard
  category: Drone
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/global/downloads/products/phantom-3-standard
  discovery:
    document_type: pdf
    item_selector: div[class^="style__document-item___"], li.groups-download-item
    title_contains:
    - Phantom 3 Standard  - Release Notes
    url_contains:
    - Phantom_3_Standard_Release_Notes
    url_excludes: []
    url_pattern: (?:_|-)en(?:[_.0-9-]|\.pdf)
  extraction:
    version:
      labels:
      - '1. All-in-One firmware Version:'
      pattern: (?:[Vv]\s*)?([0-9]+(?:\.[0-9]+){2,3})
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
      header_pattern: ^(\d{4}\.\d{1,2}\.\d{1,2})$
    whats_new:
      start_labels:
      - What's New
      - What's New?
      end_labels:
      - Notes
      - 'Notes:'
      - https://www.dji.com/mic-mini
      max_items: 10
    scope: first_release_first_page
    pdf_text:
      x_tolerance: 1
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
    document_titles:
    - PHANTOM 3 STANDARD Release Note
