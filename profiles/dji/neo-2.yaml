schema_version: 1
id: dji-neo-2
profile_version: 3
origin: official
status: verified
updated: '2026-09-11'
device:
  vendor: DJI
  model: Neo 2
  aliases:
  - DJI Neo 2
  category: Drone
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/nl/downloads/products/neo-2#doc
  discovery:
    document_type: pdf
    title_contains:
    - DJI Neo 2 - Release Notes
    url_contains:
    - neo-2
    - Release_Notes
    url_excludes:
    - assistant
  extraction:
    version:
      labels:
      - 'DJI Neo 2 Firmware:'
      pattern: '[Vv]\s*([0-9]+(?:\.[0-9]+){2,3})'
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
    whats_new:
      start_labels:
      - What's New
      - What’s New
      - What's New?
      - What’s New?
      end_labels:
      - 'Notes:'
      - Notes
      max_items: 3
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
