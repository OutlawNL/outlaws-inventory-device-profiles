schema_version: 1
id: dji-osmo-action-4
profile_version: 1
origin: official
status: verified
updated: "2026-09-11"

device:
  vendor: DJI
  model: Osmo Action 4
  aliases:
    - DJI Osmo Action 4
    - Action 4
  category: Camera

firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/nl/osmo-action-4/downloads
  discovery:
    document_type: pdf
    title_contains:
      - Osmo Action 4 - Release Notes
      - DJI Osmo Action 4 - Release Notes
    url_contains:
      - DJI_Osmo_Action_4
      - Release_Notes
    url_excludes:
      - assistant
  extraction:
    version:
      labels:
        - "Firmware Version:"
      pattern: "[Vv]?([0-9]+(?:\\.[0-9]+){2,3})"
      group: 1
    release_date:
      labels:
        - "Date:"
      formats:
        - "%Y.%m.%d"
    whats_new:
      start_labels:
        - "What's New"
        - "What’s New"
      end_labels:
        - "Notes:"
        - "Notes"
      max_items: 3
  validation:
    version_pattern: "^[0-9]+(?:\\.[0-9]+){2,3}$"
