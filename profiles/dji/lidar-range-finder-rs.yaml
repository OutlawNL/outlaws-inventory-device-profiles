schema_version: 1
id: dji-lidar-range-finder-rs
profile_version: 1
origin: official
status: verified
updated: '2026-09-12'
device:
  vendor: DJI
  model: LiDAR Range Finder (RS)
  aliases:
  - DJI LiDAR Range Finder (RS)
  category: Gimbal
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/global/downloads/products/rs-3-pro
  discovery:
    document_type: pdf
    item_selector: div[class^="style__document-item___"], li.groups-download-item
    title_contains:
    - DJI RS 3 Pro -DJI LiDAR Range Finder (RS) Release Notes
    url_contains:
    - DJI_LiDAR_Range_Finder_(RS)_Release_Notes
    url_excludes: []
    url_pattern: (?:_|-)en(?:[_.0-9-]|\.pdf)
  extraction:
    version:
      labels:
      - 'Firmware:'
      pattern: (?:[Vv]\s*)?([0-9]+(?:\.[0-9]+){2,3})
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
    whats_new:
      start_labels:
      - What's New?
      end_labels:
      - 'Notes:'
      max_items: 10
    scope: first_release_first_page
    pdf_text:
      x_tolerance: 1
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
    document_titles:
    - DJI LiDAR Range Finder (RS) Release Notes
