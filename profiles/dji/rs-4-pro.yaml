schema_version: 1
id: dji-rs-4-pro
profile_version: 1
origin: official
status: verified
updated: '2026-09-11'
device:
  vendor: DJI
  model: RS 4 Pro
  aliases:
  - DJI RS 4 Pro
  category: Gimbal
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/rs-4-pro/downloads
  discovery:
    document_type: pdf
    title_contains:
    - DJI RS 4 Pro - Release Notes
    url_contains:
    - DJI_RS_4_Pro
    - Release_Notes
    url_excludes:
    - assistant
  extraction:
    version:
      labels:
      - 'Firmware:'
      pattern: '(?:[Vv]\s*)?([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)'
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
    whats_new:
      start_labels:
      - What's New
      - What’s New
      - What's New?
      - What’s New?
      end_labels:
      - 'Notes:'
      - Notes
      max_items: 3
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
