schema_version: 1
id: dji-mic-mini-2s
profile_version: 1
origin: official
status: verified
updated: '2026-09-12'
device:
  vendor: DJI
  model: Mic Mini 2S
  aliases:
  - DJI Mic Mini 2S
  category: Microphone
firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/global/downloads/products/mic-mini-2s
  discovery:
    document_type: pdf
    item_selector: div[class^="style__document-item___"], li.groups-download-item
    title_contains:
    - DJI Mic Mini 2S  - Release Notes v1.0
    url_contains:
    - DJI_MIC_MINI_2S_RN
    url_excludes: []
    url_pattern: (?:_|-)en(?:[_.0-9-]|\.pdf)
  extraction:
    version:
      labels:
      - 'Firmware Version:'
      pattern: (?:[Vv]\s*)?([0-9]+(?:\.[0-9]+){2,3})
      group: 1
      max_lines: 12
    release_date:
      labels:
      - 'Date:'
      formats:
      - '%Y.%m.%d'
      max_lines: 12
    whats_new:
      start_labels:
      - What's New
      end_labels:
      - https://www.dji.com/mic-mini-2s
      max_items: 10
    scope: first_release_first_page
    pdf_text:
      x_tolerance: 1
  validation:
    version_pattern: ^[0-9]+(?:\.[0-9]+){2,3}$
    document_titles:
    - DJI Mic Mini 2S Release Notes
