schema_version: 1
id: dji-mini-4-pro
profile_version: 2
origin: official
status: verified
updated: "2026-09-11"

device:
  vendor: DJI
  model: Mini 4 Pro
  aliases:
    - DJI Mini 4 Pro
  category: Drone

firmware:
  strategy: release_notes_pdf
  source:
    type: html
    url: https://www.dji.com/nl/mini-4-pro/downloads
  discovery:
    document_type: pdf
    title_contains:
      - DJI Mini 4 Pro - Release Notes
    url_contains:
      - DJI_Mini_4_Pro
      - Release_Notes
    url_excludes:
      - assistant
  extraction:
    version:
      labels:
        - "Aircraft Firmware:"
      pattern: "[Vv]?([0-9]+(?:\\.[0-9]+){2,3})"
      group: 1
    release_date:
      labels:
        - "Date:"
      formats:
        - "%Y.%m.%d"
    whats_new:
      start_labels:
        - "What's New"
        - "What’s New"
      end_labels:
        - "Notes:"
        - "Notes"
      max_items: 3
  validation:
    version_pattern: "^[0-9]+(?:\\.[0-9]+){2,3}$"
