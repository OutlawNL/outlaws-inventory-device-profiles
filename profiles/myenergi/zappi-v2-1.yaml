schema_version: 1
id: myenergi-zappi-v2-1
profile_version: 1
origin: official
status: verified
updated: '2026-10-12'
device:
  vendor: myenergi
  model: zappi 2.1
  aliases:
    - Zappi 2.1
    - zappi V2.1
    - Zappi V2.1
    - zappi V2.1 / Multiphase
  category: Network
firmware:
  strategy: json_html_release_table
  source:
    type: json
    url: https://support.myenergi.com/api/v2/help_center/en-gb/articles/360020109017.json
    json_title_path: article.title
    json_content_path: article.body
  extraction:
    version:
      labels:
        - Firmware Version
      pattern: '([0-9]+(?:\.[0-9]+)+)'
      group: 1
    release_date:
      labels:
        - Release Date
      formats:
        - '%d/%m/%Y'
    whats_new:
      start_labels:
        - __PROFILE_BODY__
      end_labels:
        - __PROFILE_END__
      max_items: 3
    html_table:
      title_selector: h1
      table_selector: table
      optional_leading_columns:
        - Image
      product_column: Product
      product_value: zappi V2.1 / Multiphase (Serials starting 2)
      version_column: Firmware Version (linked to release note)
      date_column: Release Date
      summary_column: Update Instructions
  validation:
    version_pattern: '[0-9]+(?:\.[0-9]+)+'
    document_titles:
      - Current firmware versions
