<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In · Outlaw's Inventory</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v={{ app_version }}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>Outlaw's Inventory</strong><span>Know. Your. Gear.</span></div><h1>Sign In</h1><p class="muted">Enter account credentials.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="auth-form"><input type="hidden" name="next" value="{{ next }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label>{% if remember_enabled %}<label class="checkbox-line"><input type="checkbox" name="remember_me"> <span>Remember This Device</span></label>{% endif %}<button class="button primary">Sign In</button></form><footer>Outlaw's Inventory v{{ app_version }}</footer></section></main></body></html>
