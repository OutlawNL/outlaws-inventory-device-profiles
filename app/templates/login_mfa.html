<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification · Outlaw's Inventory</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v={{ app_version }}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>Outlaw's Inventory</strong><span>Know. Your. Gear.</span></div><h1>Verification</h1><p class="muted">Enter the six-digit code for {{ username }}, or use a recovery code.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/login/mfa" class="auth-form"><label>Verification Code<input name="verification_code" inputmode="numeric" autocomplete="one-time-code" autofocus required></label><button class="button primary">Verify</button></form><footer>Outlaw's Inventory v{{ app_version }}</footer></section></main></body></html>
