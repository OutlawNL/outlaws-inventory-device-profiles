<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Administrator · Outlaw's Inventory</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/app.css?v={{ app_version }}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>Outlaw's Inventory</strong><span>Know. Your. Gear.</span></div><h1>Create Administrator</h1><p class="muted">Authentication is now required. Create the first administrator account.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/setup-admin" class="auth-form"><label>Username<input name="username" value="{{ username or '' }}" autocomplete="username" minlength="3" maxlength="64" required autofocus></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required><small>At least 12 characters.</small></label><label>Confirm Password<input name="password_confirm" type="password" autocomplete="new-password" minlength="12" required></label><button class="button primary">Create Administrator</button></form><footer>Outlaw's Inventory v{{ app_version }}</footer></section></main></body></html>
